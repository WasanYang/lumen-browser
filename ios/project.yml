# XcodeGen spec for the iPhone/iPad app. ios/build.sh fills Generated/ and runs `xcodegen generate`;
# Lumen.xcodeproj is generated, not committed.
name: Lumen
options:
  bundleIdPrefix: io.github.wasanyang
  deploymentTarget:
    iOS: "17.0"
packages:
  LumenCore:
    path: ../shared/LumenCore
targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - Sources/Lumen
      - path: Generated/Assets.xcassets
      - path: Generated/blocklist.txt
        buildPhase: resources
      - path: Generated/uBOLite
        type: folder
        buildPhase: resources
    dependencies:
      - package: LumenCore
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # Music keeps playing with the screen locked or another app in front.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wasanyang.lumen
        # The owner's free personal team (Apple ID signed in to Xcode). A team ID is not a secret.
        DEVELOPMENT_TEAM: 4UWS4ZVGMD
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
